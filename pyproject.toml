[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baoyi"
version = "0.2.0"
description = "报一 (Baoyi) - Provider-neutral coding and PowerPoint agent harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "zhangjianning" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
baoyi = "agent.main:main"
baoyi-bench = "agent.benchmark:main"
baoyi-doctor = "agent.doctor:main"
baoyi-validate-run = "agent.run_bundle_validator:main"
# Legacy aliases
xiaopu = "agent.main:main"
xiaopu-bench = "agent.benchmark:main"
xiaopu-doctor = "agent.doctor:main"
xiaopu-validate-run = "agent.run_bundle_validator:main"
agent-gui = "agent.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "core*",
    "domains*",
    "adapters*",
    "runner*",
]
exclude = [
    "benchmarks*",
    "tests*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
agent = [
    "builtin_skills/**/*",
    "web/**/*",
    "assets/*",
]
