[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baoyi"
version = "0.2.0"
description = "报一 (Baoyi) - Provider-neutral coding and PowerPoint agent harness."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "zhangjianning" }
]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "python-pptx>=1.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
baoyi = "agent.main:main"
xiaopu = "agent.main:main"
agent-gui = "agent.gui:main"
baoyi-bench = "agent.benchmark:main"
xiaopu-bench = "agent.benchmark:main"
baoyi-doctor = "agent.doctor:main"
xiaopu-doctor = "agent.doctor:main"
baoyi-validate-run = "benchmarks.validate_run_bundle:main"
xiaopu-validate-run = "benchmarks.validate_run_bundle:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "benchmarks*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
agent = ["builtin_skills/*/SKILL.md"]

