name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  package-smoke:
    name: Package Build & CLI Contract Smoke (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build wheel package
        run: |
          python -m build

      - name: Install wheel in isolated environment
        run: |
          pip install dist/*.whl

      - name: Verify CLI entry points & installation contract
        run: |
          baoyi --help
          baoyi-bench --help
          baoyi-doctor --help
          baoyi-doctor --check-install
          baoyi-validate-run --help

          # Verify doctor returns 1 when credentials are missing (expected behavior)
          set +e
          baoyi-doctor
          DOCTOR_EXIT=$?
          set -e
          if [ "$DOCTOR_EXIT" -ne 1 ]; then
            echo "Expected baoyi-doctor to exit with 1 in unconfigured environment, got $DOCTOR_EXIT"
            exit 1
          fi

          # Verify workspace default is current working directory, never site-packages
          mkdir -p /tmp/custom_project_workspace
          cd /tmp/custom_project_workspace
          DOCTOR_JSON=$(baoyi-doctor --check-install)
          echo "$DOCTOR_JSON"
          if ! echo "$DOCTOR_JSON" | grep -q "/tmp/custom_project_workspace"; then
            echo "Error: doctor did not resolve workspace to current working directory"
            exit 1
          fi

      - name: Verify Validator Semantic Contract
        run: |
          # 1. Negative test: Empty directory must fail validation
          mkdir -p /tmp/empty_bundle
          if baoyi-validate-run /tmp/empty_bundle; then
            echo "Error: empty bundle unexpectedly passed validation"
            exit 1
          fi

          # 2. Positive test: Complete minimal bundle must pass validation
          mkdir -p /tmp/valid_bundle/input
          echo "Test instruction" > /tmp/valid_bundle/input/instruction.md
          echo "PPT data" > /tmp/valid_bundle/output.pptx
          echo '# Trajectory' > /tmp/valid_bundle/trajectory.md
          echo '[]' > /tmp/valid_bundle/tool_calls.json
          echo '{"score": 1}' > /tmp/valid_bundle/evaluation.json
          echo '{"schema": "baoyi-run-v1"}' > /tmp/valid_bundle/run_manifest.json
          baoyi-validate-run /tmp/valid_bundle

  smoke:
    name: Smoke Matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[test]

      - name: Run Core Test Suite
        run: |
          pytest tests/test_harness.py tests/test_layer_boundaries.py tests/test_skills.py tests/test_task_profiles.py tests/test_validate_run_bundle.py tests/test_web_gui.py -q

  full-test:
    name: Full Regression (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[test]

      - name: Run Hermetic Regression Suite
        run: |
          pytest -q -m "not swebench and not research_state and not protocol_lock and not gui and not live_provider"

      - name: Run Research Protocol Lock Suite
        run: |
          pytest -q -m "protocol_lock"
